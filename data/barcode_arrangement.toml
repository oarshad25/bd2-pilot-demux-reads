[arrangement]
name = "NB96Custom"
kit = "custom"

mask1_front = "GTTTTCCCAGTCACGAC"
mask1_rear = "TTTCTGTTGGTGCTGATATTGC"
mask2_front = "GAAGATAGAGCGACAGGCAAGT"
mask2_rear = "GTCATAGCTGTTTCCTG"

# Barcode sequences
barcode1_pattern = "CB%02i"
barcode2_pattern = "CB%02i"
first_index = 1
last_index = 96

## Scoring options
[scoring]
max_barcode_penalty = 11
barcode_end_proximity = 75
min_barcode_penalty_dist = 3
min_separation_only_dist = 6
flank_left_pad = 5
flank_right_pad = 10
front_barcode_window = 175
rear_barcode_window = 175
midstrand_flank_score = 0.95
